model:
  name: "unsloth/Qwen2.5-1.5B-Instruct"
  max_seq_length: 2048

training:
  batch_size: 1
  gradient_accumulation_steps: 8
  warmup_steps: 100
  epochs: 3
  learning_rate: 5e-6
  eval_steps: 1000
  logging_steps: 1000
  optimizer: "adamw_8bit"
  weight_decay: 0.0
  lr_scheduler_type: "linear"
  seed: 323
  save_steps: 1000
  save_total_limit: 2

peft:
  r: 32
  lora_alpha: 64

data:
  num_proc: 4

dpo:
  beta: 0.1
  max_prompt_length: 512