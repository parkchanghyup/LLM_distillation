# config/training_config.yaml
model:
  name: "unsloth/Qwen2.5-1.5B-Instruct"
  max_seq_length: 2048

peft:
  r: 16
  lora_alpha: 16

data:
  num_proc: 2

training:
  batch_size: 2
  gradient_accumulation_steps: 4
  warmup_steps: 1000
  epochs: 3
  learning_rate: 3e-5
  eval_steps: 1000
  logging_steps: 500
  optimizer: "adamw_8bit"
  weight_decay: 0.01
  lr_scheduler_type: "linear"
  seed: 3407
  save_steps: 1000
  save_total_limit: 3